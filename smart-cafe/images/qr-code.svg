<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 250" width="250" height="250">
  <rect width="250" height="250" fill="#FFFFFF"/>
  <!-- Outer Corner Position Markers -->
  <!-- Top Left -->
  <rect x="20" y="20" width="60" height="60" fill="#24140D" rx="8"/>
  <rect x="30" y="30" width="40" height="40" fill="#FFFFFF" rx="4"/>
  <rect x="40" y="40" width="20" height="20" fill="#24140D" rx="2"/>
  
  <!-- Top Right -->
  <rect x="170" y="20" width="60" height="60" fill="#24140D" rx="8"/>
  <rect x="180" y="30" width="40" height="40" fill="#FFFFFF" rx="4"/>
  <rect x="190" y="40" width="20" height="20" fill="#24140D" rx="2"/>
  
  <!-- Bottom Left -->
  <rect x="20" y="170" width="60" height="60" fill="#24140D" rx="8"/>
  <rect x="30" y="180" width="40" height="40" fill="#FFFFFF" rx="4"/>
  <rect x="40" y="190" width="20" height="20" fill="#24140D" rx="2"/>

  <!-- Simulated QR Data Pattern Grid -->
  <g fill="#24140D">
    <!-- Row 1-4 random data blocks -->
    <rect x="95" y="25" width="12" height="12"/>
    <rect x="115" y="25" width="12" height="12"/>
    <rect x="140" y="25" width="12" height="12"/>
    <rect x="95" y="45" width="25" height="12"/>
    <rect x="130" y="45" width="12" height="25"/>
    <rect x="150" y="45" width="12" height="12"/>

    <!-- Center Pattern -->
    <rect x="30" y="95" width="12" height="25"/>
    <rect x="50" y="105" width="25" height="12"/>
    <rect x="90" y="90" width="70" height="70" fill="#D97706" rx="8"/>
    <!-- Center Coffee Cup in QR -->
    <path d="M 112 115 L 112 135 C 112 142 138 142 138 135 L 138 115 Z" fill="#FFFFFF"/>
    <path d="M 138 120 C 146 120 146 130 138 130" fill="none" stroke="#FFFFFF" stroke-width="3"/>
    <path d="M 116 110 Q 119 105 121 112 Q 123 118 126 110" fill="none" stroke="#FFFFFF" stroke-width="2"/>

    <!-- Bottom Data Blocks -->
    <rect x="175" y="95" width="20" height="12"/>
    <rect x="205" y="95" width="15" height="25"/>
    <rect x="175" y="125" width="12" height="25"/>
    <rect x="200" y="130" width="20" height="12"/>

    <rect x="95" y="175" width="15" height="15"/>
    <rect x="120" y="175" width="25" height="12"/>
    <rect x="155" y="175" width="12" height="25"/>
    <rect x="95" y="200" width="35" height="12"/>
    <rect x="140" y="205" width="20" height="15"/>
    <rect x="180" y="175" width="12" height="15"/>
    <rect x="200" y="180" width="25" height="12"/>
    <rect x="175" y="205" width="40" height="15"/>
  </g>
</svg>
