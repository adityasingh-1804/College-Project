<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <rect width="400" height="300" fill="#FFF6EB"/>
  <!-- Saucer Shadow -->
  <ellipse cx="200" cy="245" rx="110" ry="20" fill="#E8DED6"/>
  <!-- Ceramic Saucer -->
  <ellipse cx="200" cy="240" rx="100" ry="18" fill="#FFFFFF" stroke="#E8DED6" stroke-width="3"/>
  <ellipse cx="200" cy="238" rx="65" ry="10" fill="#F6EFE8"/>
  <!-- Steam -->
  <path d="M 180 90 Q 170 65 185 45" fill="none" stroke="#9C6644" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <path d="M 200 85 Q 215 60 200 40" fill="none" stroke="#9C6644" stroke-width="3.5" stroke-linecap="round" opacity="0.8"/>
  <path d="M 220 90 Q 210 65 225 45" fill="none" stroke="#9C6644" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <!-- Cup Body -->
  <path d="M 140 115 L 260 115 L 245 220 C 245 230 230 236 200 236 C 170 236 155 230 155 220 Z" fill="#FFFFFF" stroke="#E8DED6" stroke-width="3"/>
  <!-- Coffee Surface & Latte Art -->
  <ellipse cx="200" cy="115" rx="58" ry="15" fill="#4A2E20"/>
  <ellipse cx="200" cy="115" rx="45" ry="10" fill="#6F4E37"/>
  <!-- Heart Latte Art -->
  <path d="M 200 118 C 190 108 180 115 190 122 L 200 127 L 210 122 C 220 115 210 108 200 118 Z" fill="#FDFBF7"/>
  <!-- Handle -->
  <path d="M 255 130 C 290 130 290 190 250 190" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
  <path d="M 255 130 C 290 130 290 190 250 190" fill="none" stroke="#E8DED6" stroke-width="4" stroke-linecap="round"/>
  <text x="200" y="280" font-family="sans-serif" font-weight="bold" font-size="16" fill="#6F4E37" text-anchor="middle">Artisan Cappuccino & Latte</text>
</svg>
