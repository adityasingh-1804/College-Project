<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <rect width="400" height="300" fill="#FFF6EB"/>
  <!-- Shadow -->
  <ellipse cx="200" cy="255" rx="100" ry="18" fill="#E8DED6"/>
  <!-- Golden Fries Sticking Out -->
  <g fill="#F59E0B" stroke="#D97706" stroke-width="2">
    <rect x="150" y="80" width="16" height="110" rx="3" transform="rotate(-15 150 80)"/>
    <rect x="175" y="70" width="16" height="120" rx="3" transform="rotate(-5 175 70)"/>
    <rect x="205" y="65" width="16" height="125" rx="3" transform="rotate(5 205 65)"/>
    <rect x="230" y="75" width="16" height="115" rx="3" transform="rotate(18 230 75)"/>
    <rect x="135" y="105" width="16" height="85" rx="3" transform="rotate(-25 135 105)"/>
    <rect x="245" y="100" width="16" height="90" rx="3" transform="rotate(28 245 100)"/>
    <rect x="185" y="90" width="16" height="100" rx="3" transform="rotate(2 185 90)"/>
  </g>
  <!-- Red Fry Box Container -->
  <path d="M 130 160 L 145 250 L 255 250 L 270 160 Q 200 175 130 160 Z" fill="#EF4444"/>
  <!-- Curved Box Front Cutout -->
  <path d="M 130 160 Q 200 200 270 160 L 255 250 L 145 250 Z" fill="#DC2626"/>
