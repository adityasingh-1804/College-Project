  <circle cx="200" cy="210" r="20" fill="#FBBF24"/>
  <path d="M 192 200 L 192 220 M 192 200 C 196 195 204 195 208 200 L 208 220" stroke="#DC2626" stroke-width="4" fill="none"/>
  <text x="200" y="285" font-family="sans-serif" font-weight="bold" font-size="16" fill="#6F4E37" text-anchor="middle">Crispy Peri Peri Fries</text>
</svg>
